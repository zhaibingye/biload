name: biload
description: "本地优先的跨平台哔哩哔哩视频下载工具。"
publish_to: 'none'

version: 1.0.1+8

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.11.1
  crypto: ^3.0.8
  flutter_secure_storage: ^11.2.0
  sqlite3: ^3.8.0
  path_provider: ^2.1.6
  path: ^1.9.1
  qr_flutter: ^4.1.0
  file_picker: ^13.3.0
  desktop_webview_window: ^0.4.0
  webview_flutter: ^4.14.1
  background_downloader: ^9.6.4
  ffmpeg_kit_flutter_new: ^4.6.7
  pointycastle: ^4.0.0
  basic_utils: ^5.8.2

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - LICENSE
    - THIRD_PARTY_NOTICES.md
