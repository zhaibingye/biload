name: Release packages
on:
  workflow_dispatch:
    inputs:
      target:
        description: Platform to build
        type: choice
        default: all
        options: [all, windows, linux, macos, android]
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  desktop:
    if: inputs.target != 'android'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.target == 'linux' && '[{"os":"ubuntu-22.04","target":"linux","package":"linux-x64"}]' || inputs.target == 'macos' && '[{"os":"macos-15","target":"macos","package":"macos-universal"}]' || inputs.target == 'windows' && '[{"os":"windows-latest","target":"windows","package":"windows-x64"}]' || '[{"os":"windows-latest","target":"windows","package":"windows-x64"},{"os":"ubuntu-22.04","target":"linux","package":"linux-x64"},{"os":"macos-15","target":"macos","package":"macos-universal"}]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'macOS'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          cache: true
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libjson-glib-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev ffmpeg libopencore-amrnb0 libvo-amrwbenc0
      - run: flutter pub get
      - run: flutter build ${{ matrix.target }} --release
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y xvfb dbus-x11 fonts-noto-cjk patchelf network-manager
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = ((Select-String '^version:' pubspec.yaml).Line -split ' ')[1].Split('+')[0]
          Copy-Item LICENSE,THIRD_PARTY_NOTICES.md,AUTHORS build/windows/x64/runner/Release/
          $files = Get-ChildItem build/windows/x64/runner/Release | Where-Object { $_.Name -notin @('user-data', 'downloads') }
          Compress-Archive -Path $files.FullName -DestinationPath "biload-$version-windows-x64.zip"
      - if: runner.os == 'Linux'
        run: |
          version=$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)
          bundle=build/linux/x64/release/bundle
          cp LICENSE THIRD_PARTY_NOTICES.md AUTHORS "$bundle/"
          # FFmpegKit's Ubuntu 22.04 build links libvpx.so.7; Ubuntu 24.04
          # supplies libvpx.so.9. Bundle this codec ABI with its license.
          for soname in libvpx.so.7 libopencore-amrnb.so.0 libvo-amrwbenc.so.0; do
            library=$(ldconfig -p | awk -v name="$soname" '$1 == name { path=$NF } END { print path }')
            test -n "$library"
            cp -L "$library" "$bundle/lib/$soname"
          done
          for package in libvpx7 libopencore-amrnb0 libvo-amrwbenc0; do
            mkdir -p "$bundle/licenses/$package"
            cp "/usr/share/doc/$package/copyright" "$bundle/licenses/$package/"
            dpkg-query -W -f='${Package} ${Version}\n' "$package" > "$bundle/licenses/$package/package.txt"
          done
          mkdir -p "$bundle/licenses/ffmpeg_kit_flutter_new"
          cp build/linux/x64/release/plugins/ffmpeg_kit_flutter_new/ffmpeg-kit/ffmpeg-kit/lib/*.txt "$bundle/licenses/ffmpeg_kit_flutter_new/"
          # Prebuilt engines/codecs also need a relocatable sibling lookup path.
          for library in "$bundle"/lib/*.so*; do
            patchelf --set-rpath '$ORIGIN' "$library"
          done
          ldd "$bundle/biload" "$bundle/lib/libffmpegkit.so" | tee linux-runtime.txt
          if grep -q 'not found' linux-runtime.txt; then exit 1; fi
          python3 -c "import ctypes; ctypes.CDLL('$bundle/lib/libffmpegkit.so'); print('FFmpegKit runtime loaded')"
          sudo systemctl start NetworkManager
          xvfb-run -a dbus-run-session -- python3 tool/verify_desktop_release.py --executable build/linux/x64/release/bundle/biload
          tar --exclude=./user-data --exclude=./downloads -czf "biload-$version-linux-x64.tar.gz" -C "$bundle" .
      - if: runner.os == 'macOS'
        run: |
          version=$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)
          app=build/macos/Build/Products/Release/biload.app
          lipo -archs "$app/Contents/MacOS/biload" | tee macos-architectures.txt
          grep -q arm64 macos-architectures.txt
          grep -q x86_64 macos-architectures.txt
          cp LICENSE THIRD_PARTY_NOTICES.md AUTHORS "$app/Contents/Resources/"
          codesign --force --deep --preserve-metadata=entitlements --sign - "$app"
          codesign --verify --deep --strict "$app"
          python3 tool/verify_desktop_release.py --executable "$app/Contents/MacOS/biload"
          ditto -c -k --sequesterRsrc --keepParent "$app" "biload-$version-macos-universal.zip"
      - if: runner.os == 'Windows'
        run: python tool/verify_desktop_release.py --executable build/windows/x64/runner/Release/biload.exe
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.package }}
          path: artifacts/runtime/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: biload-${{ matrix.package }}
          path: |
            biload-*.zip
            biload-*.tar.gz
            *-architectures.txt
            linux-runtime.txt
          if-no-files-found: error
  compatibility:
    needs: desktop
    if: inputs.target == 'all' || inputs.target == 'linux' || inputs.target == 'macos' || github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.target == 'linux' && '[{"os":"ubuntu-24.04","package":"linux-x64"}]' || inputs.target == 'macos' && '[{"os":"macos-15-intel","package":"macos-universal"}]' || '[{"os":"ubuntu-24.04","package":"linux-x64"},{"os":"macos-15-intel","package":"macos-universal"}]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: biload-${{ matrix.package }}
          path: package
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libgtk-3-0 libwebkit2gtk-4.1-0 libsecret-1-0 libjson-glib-1.0-0 xvfb dbus-x11 fonts-noto-cjk network-manager
          sudo systemctl start NetworkManager
          mkdir unpacked
          tar xzf package/biload-*-linux-x64.tar.gz -C unpacked
          xvfb-run -a dbus-run-session -- python3 tool/verify_desktop_release.py --executable unpacked/biload
      - if: runner.os == 'macOS'
        run: |
          ditto -x -k package/biload-*-macos-universal.zip unpacked
          python3 tool/verify_desktop_release.py --executable unpacked/biload.app/Contents/MacOS/biload
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.os }}
          path: artifacts/runtime/
          if-no-files-found: error
  android:
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'android'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release --target-platform android-arm64 --split-per-abi
      - run: dart run tool/verify_android_plugins.dart
      - run: python3 tool/verify_android_package.py build/app/outputs/flutter-apk/app-arm64-v8a-release.apk --build-tools "$ANDROID_HOME/build-tools/36.0.0" --unsigned --report artifacts/android/static-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: android-static-report
          path: artifacts/android/static-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: biload-android-arm64-unsigned-check-only
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
